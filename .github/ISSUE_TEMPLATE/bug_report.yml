name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: jellyfin
    attributes:
      label: Jellyfin version
      placeholder: for example, 10.10.3
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and player
      placeholder: for example, Jellyfin for Android 2.7.3, integrated (ExoPlayer) player
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: Image tag
      placeholder: for example, ghcr.io/forward-tonight7079/jellyfin-force-transcode:0.1.0
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: Your rules.json
      render: json
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Proxy logs
      description: Output of `docker logs <container>` (set `LOG=events` or `LOG=full`).
      render: text
